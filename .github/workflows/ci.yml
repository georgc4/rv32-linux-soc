name: fast-checks
on: [push, pull_request]
jobs:
  rtl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation and lint tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator
      - name: Run contract simulation
        run: make test
      - name: Validate hard RF interface and asset identity
        run: |
          python3 scripts/check_rf_experiment.py
          make test-rf
      - name: Run diagnostic CPU program
        run: make test-core
      - name: Check iterative M arithmetic
        run: make test-mdu
      - name: Run machine trap program
        run: make test-priv
      - name: Run Sv32 walk and supervisor transition
        run: make test-sv32 test-supervisor
      - name: Run serial memory transactions
        run: make test-serial
      - name: Run UART receive and interrupt test
        run: make test-uart
      - name: Check physical UART pin paths
        run: make test-physical-uart
      - name: Run PLIC routing and claim test
        run: make test-plic
      - name: Run timer and software interrupt test
        run: make test-timer
      - name: Boot integrated SoC and reject corrupt image
        run: make test-soc-bad
      - name: Run host digit baseline
        run: make test-digit
      - name: Lint bus RTL
        run: make lint

  memory-datasheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: typical-latency-max-output-delay
            worst: 0
            output: 6.0
          - profile: worst-latency-max-output-delay
            worst: 1
            output: 6.0
          - profile: worst-latency-fast-output
            worst: 1
            output: 2.0
    name: memory / ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Prove model behavior and negative timing checks
        run: make test-memory-model
      - name: Full-capacity bridge transactions at 20 MHz
        run: make test-memory-datasheet DATASHEET_WORST=${{ matrix.worst }} DATASHEET_OUTPUT=${{ matrix.output }}

  serial-boot-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python -m pip install -r test/requirements.txt
      - name: Boot and reject corrupt image through production wrapper pins
        run: make -C test
